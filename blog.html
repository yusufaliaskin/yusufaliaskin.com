<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Blog — Yusuf Ali Aşkın</title>
    <meta name="description" content="Technical blog by Yusuf Ali Aşkın — in-depth engineering articles on cybersecurity, software systems, Linux kernel networking, and AI.">
    <meta name="keywords" content="Yusuf Ali Aşkın, technical blog, cybersecurity, programming, Linux networking, SIEM architecture, AI tools, web systems">
    <meta name="author" content="Yusuf Ali Aşkın">
    <meta name="theme-color" content="#0A0A0C">
    <meta property="og:title" content="Technical Blog — Yusuf Ali Aşkın">
    <meta property="og:description" content="In-depth engineering articles on cybersecurity, software systems, Linux networking, and AI.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yusufaliaskin.com/blog.html">
    <meta property="og:image" content="assets/images/og-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Technical Blog — Yusuf Ali Aşkın">
    <meta name="twitter:description" content="Engineering articles on cybersecurity, SIEM, Linux, and AI.">
    <meta name="twitter:image" content="assets/images/og-preview.png">
    <link rel="icon" type="image/svg+xml" href="assets/images/logom.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="assets/js/theme.js"></script>
</head>
<body>
    <div class="scroll-progress" aria-hidden="true"></div>
    <div id="navbar"></div>

    <!-- Page Hero -->
    <section class="page-hero">
        <div class="container text-center">
            <span class="section-label" data-i18n="blogPageLabel">Technical Articles</span>
            <h1 data-i18n="blogPageTitle">Engineering Notes & Insights</h1>
            <p data-i18n="blogPageDescription">In-depth guides, architectural blueprints, and production insights across software engineering and cybersecurity.</p>
        </div>
    </section>

    <!-- Blog Posts & Filters -->
    <section class="section" id="blog-section">
        <div class="container">
            <!-- Search & Filter Controls -->
            <div class="blog-controls-wrapper">
                <div class="blog-search-box">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="blog-search-input" placeholder="Search technical articles by topic, keyword, or tag..." data-i18n-placeholder="blogSearchPlaceholder" autocomplete="off">
                </div>

                <div class="filter-bar" id="blog-filters" role="group" aria-label="Blog category filters">
                    <button class="filter-btn active" data-filter="All" data-i18n="blogFilterAll">All</button>
                    <button class="filter-btn" data-filter="Cybersecurity" data-i18n="blogFilterSecurity">Cybersecurity</button>
                    <button class="filter-btn" data-filter="Programming" data-i18n="blogFilterDev">Programming</button>
                    <button class="filter-btn" data-filter="Linux" data-i18n="blogFilterLinux">Linux</button>
                    <button class="filter-btn" data-filter="AI" data-i18n="blogFilterAI">AI</button>
                    <button class="filter-btn" data-filter="Networking" data-i18n="blogFilterNetwork">Networking</button>
                    <button class="filter-btn" data-filter="Web Development" data-i18n="blogFilterWeb">Web Development</button>
                </div>
            </div>

            <!-- Blog Grid -->
            <div class="blog-preview-grid" id="all-blog-posts">
                <!-- Rendered by JavaScript -->
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <button class="back-to-top" aria-label="Scroll to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>

    <script src="assets/js/language.js"></script>
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/projects.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
